name: Build Freebuff model snapshot and update MODELS.md

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run parser (generate freebuff-models.json + MODELS.md)
        run: |
          node scripts/build-freebuff-models-json.mjs freebuff-models.json

      - name: Upload JSON to Release (Worker fallback source)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="models-cache"
          FILE="freebuff-models.json"

          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --title "Freebuff Models (auto)" \
              --notes "Automatically updated dynamic model mapping snapshot (Worker fallback source)" \
              --latest
          gh release delete-asset "$TAG" "$FILE" --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          gh release upload "$TAG" "$FILE" --repo "${GITHUB_REPOSITORY}" --clobber
          echo "✅ Release asset updated (tag: $TAG)"

      - name: Commit MODELS.md update to main (keeps the workflow active)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MODELS.md
          if git diff --cached --quiet; then
            echo "MODELS.md unchanged; skipping commit"
          else
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)
            git commit -m "docs: update MODELS.md (${DATE} Beijing Time)" --no-verify
            git push origin main
            echo "✅ MODELS.md committed and pushed"
          fi



      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "deleted: $run_id"
              gh run delete $run_id || true
            fi
          done
