name: Get Freebuff authToken


on:
  workflow_dispatch:
    inputs:
      poll_timeout:
        description: "Authorization wait time in seconds (default 300)"
        required: false
        default: "300"
        type: string
      fingerprint:
        description: "Specify fingerprintId (leave blank to generate automatically)"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write

jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:

      - name: Validate Telegram variables (skip if not configured)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -u
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "❌ TG_BOT_TOKEN or TG_CHAT_ID is not configured; the workflow will not run."
            echo "   Configure these two secrets in Repository Settings → Secrets and variables → Actions:"
            echo "     - TG_BOT_TOKEN：Telegram Bot token"
            echo "     - TG_CHAT_ID  ：chat_id that receives messages"
            exit 1
          fi
          echo "✅ Telegram variables are configured; continuing."

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Test Telegram connectivity（send a test message）
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          cd freebuff_tools
          python3 extract_freebuff.py tgsend

      - name: Run extraction script (send authorization link and authToken to Telegram)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OAUTH_POLL_TIMEOUT: ${{ inputs.poll_timeout }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          cd freebuff_tools
          if [ -n "$FINGERPRINT" ]; then
            python3 -u extract_freebuff.py login --fingerprint "$FINGERPRINT"
          else
            python3 -u extract_freebuff.py login
          fi


      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "deleted: $run_id"
              gh run delete $run_id || true
            fi
          done
